[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "battleship-ai"
version = "1.0.0"
description = "Play Battleship against a random agent, an ISMCTS agent and a deep-learned CNN agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.0", "pytest>=7"]

[project.scripts]
battleship-ai = "battleship_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["battleship_ai*"]

[tool.setuptools.package-data]
battleship_ai = ["web/*", "weights/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
